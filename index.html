<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon-32.png" sizes="32x32" />
    <link rel="icon" type="image/png" href="/favicon.png" sizes="512x512" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Todas las tipografías son autohospedadas: cero peticiones a terceros
         en la ruta crítica. La de marca se precarga porque pinta el wordmark
         del hero, que es el elemento LCP. -->
    <link
      rel="preload"
      href="/fonts/AlteHaasGroteskRegular.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <!-- Origen de las imágenes de producto: adelanta DNS+TLS -->
    <link rel="preconnect" href="https://ffurplzqeldxzeheetgg.supabase.co" crossorigin />
    <meta
      name="description"
      content="KALEMCI — Maison de nuit. Dark luxury streetwear from México. Collection I: REEBLOM."
    />
    <meta property="og:title" content="KALEMCI — Maison de nuit" />
    <meta
      property="og:description"
      content="Dark luxury streetwear from México. Collection I: REEBLOM."
    />
    <meta property="og:type" content="website" />
    <meta name="theme-color" content="#000000" />
    <title>KALEMCI &mdash; Maison de nuit</title>

    <!-- App shell crítico, inline: replica exactamente el fotograma 0 de la
         intro (placa negra + wordmark tenue). Pinta con el HTML, sin esperar
         al bundle de JS, así que el LCP deja de depender del arranque de Vue.
         Vue lo reemplaza al montar por la versión real — mismo texto, mismo
         sitio, mismo tamaño: el relevo es invisible. -->
    <style>
      html,
      body {
        margin: 0;
        background: #000;
      }
      #boot {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #000;
        /* Halo plateado del backdrop, que es lo que se ve tras las letras */
        background-image: radial-gradient(
          circle at 50% 50%,
          rgba(201, 208, 214, 0.14) 0%,
          rgba(201, 208, 214, 0.05) 40%,
          transparent 66%
        );
      }
      #boot span {
        font-family: 'Alte Haas Grotesk', 'Helvetica Neue', Helvetica, Arial, sans-serif;
        font-weight: 400;
        font-size: clamp(3.25rem, 10.5vw, 10rem);
        /* Interlineado con holgura: el glifo va centrado por flex, así que no
           cambia nada visualmente, pero da al primer pintado un área algo
           mayor que la del <text> SVG que lo releva — el LCP se queda aquí,
           en los ~600ms, en vez de "mudarse" al SVG posterior. */
        line-height: 1.3;
        /* Mismo tracking que .monolith-text: relevo imperceptible */
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: #1c1d1e;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="boot" aria-hidden="true"><span>Kalemci</span></div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
